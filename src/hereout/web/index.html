<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HereOut</title>
<meta name="description" content="Take a photo of an evacuation plan and get the way out.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>HereOut</h1>
  <p>Take a photo of the evacuation plan on the wall. Get the way out.</p>
</header>
<main>
  <label class="shoot">
    <input id="photo" type="file" accept="image/*" capture="environment">
    <span>Take a photo of the plan</span>
  </label>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <div class="stage">
      <canvas id="plan" aria-label="The plan with the route"></canvas>
    </div>
    <div class="fix">
      <button id="fix" type="button">Fix the marks</button>
      <span id="fix-hint" hidden>Tap where you are, then tap the exit.</span>
    </div>
    <h2>Steps</h2>
    <ol id="steps"></ol>
    <button id="speak" type="button">Read the steps aloud</button>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
